name: Android & Functions

# Второй и третий исполнители общего фикстура математики баллов
# (specs/fixtures/points-fixtures.json). Третий — iOS, он в ios.yml.
# Если правится фикстур — красным должны становиться все три, иначе смысла в нём нет.

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', 'functions/**', 'specs/fixtures/**', '.github/workflows/checks.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'android/**', 'functions/**', 'specs/fixtures/**', '.github/workflows/checks.yml' ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # :domain — чистый Kotlin/JVM, тесты идут без Android вообще (секунды).
      # :app — компиляция всего остального поверх домена.
      - name: Unit tests
        working-directory: android
        run: ./gradlew :domain:test :feature:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      # Границы модулей держит Gradle: :domain не видит Android, :feature — ни
      # Firebase, ни Compose, ни :data. Компилятор ловит это сам. Здесь — только
      # то, чего он поймать не может: firebase-common лежит на classpath :app
      # ради FirebaseApp.initializeApp, поэтому импорт Firebase в экран остаётся
      # технически возможным. Разрешены ровно две точки входа фреймворка.
      - name: Boundary guard (Firebase only at framework entry points)
        working-directory: android
        run: |
          offenders=$(grep -rln "com\.google\.firebase" app/src/main/java feature/src \
            --include="*.kt" \
            | grep -v "app/src/main/java/kg/ayant/app/AyantApp.kt" \
            | grep -v "app/src/main/java/kg/ayant/app/push/AyantMessagingService.kt" || true)
          if [ -n "$offenders" ]; then
            echo "Firebase выше слоя данных:"; echo "$offenders"
            echo "Обращение к Firebase идёт через контракт домена (:domain/contract) и реализацию в :data."
            exit 1
          fi

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            android/domain/build/reports/tests/test
            android/app/build/reports/tests/testDebugUnitTest

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        working-directory: functions
        run: npm ci

      # `npm test` сам собирает TypeScript (pretest → build), поэтому ошибка типов
      # тоже валит шаг: отдельный typecheck не нужен.
      - name: Test
        working-directory: functions
        run: npm test
